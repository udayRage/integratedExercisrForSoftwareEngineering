<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <g id="actor" stroke-width="1.5" fill="none">
      <circle cx="0" cy="-30" r="10"/><line x1="0" y1="-20" x2="0" y2="10"/>
      <line x1="-16" y1="-10" x2="16" y2="-10"/><line x1="0" y1="10" x2="-13" y2="32"/><line x1="0" y1="10" x2="13" y2="32"/>
    </g>
  </defs>
  <rect width="1120" height="640" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">How we collect the product backlog</text>

  <!-- Step labels -->
  <text x="40"  y="62" font-weight="bold" fill="#555">① WHO? (users)</text>
  <text x="290" y="62" font-weight="bold" fill="#555">② WHAT do they want? (user stories)</text>
  <text x="730" y="62" font-weight="bold" fill="#555">③ ONE sorted list</text>

  <!-- RFP source -->
  <g transform="translate(40,560)">
    <path d="M0,0 h44 l14,14 v50 h-58 z" fill="#fff8dc" stroke="#b8860b" stroke-width="1.5"/>
    <path d="M44,0 v14 h14" fill="none" stroke="#b8860b" stroke-width="1.5"/>
    <text x="29" y="40" text-anchor="middle" font-weight="bold" fill="#8a6d0b">RFP</text>
    <text x="70" y="25" fill="#555">Read the RFP to find</text>
    <text x="70" y="42" fill="#555">users and their needs</text>
  </g>

  <!-- Actors -->
  <use href="#actor" x="90" y="150" stroke="#2e7d32"/>
  <text x="90" y="200" text-anchor="middle" font-weight="bold">Instructor</text>
  <use href="#actor" x="90" y="320" stroke="#1565c0"/>
  <text x="90" y="370" text-anchor="middle" font-weight="bold">Sub-instructor</text>
  <use href="#actor" x="90" y="460" stroke="#6a1b9a"/>
  <text x="90" y="510" text-anchor="middle" font-weight="bold">Student</text>

  <!-- Lines actor -> story -->
  <g stroke="#333" stroke-width="1.2" marker-end="url(#ar)">
    <line x1="110" y1="135" x2="300" y2="92"/>
    <line x1="110" y1="140" x2="300" y2="150"/>
    <line x1="110" y1="145" x2="300" y2="208"/>
    <line x1="110" y1="310" x2="300" y2="290"/>
    <line x1="110" y1="445" x2="300" y2="368"/>
    <line x1="110" y1="450" x2="300" y2="426"/>
    <line x1="110" y1="455" x2="300" y2="484"/>
    <line x1="110" y1="460" x2="300" y2="542"/>
  </g>

  <!-- Story ovals: green=Must, blue=Should, orange=Could -->
  <g stroke-width="1.5">
    <ellipse cx="420" cy="92"  rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="150" rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="208" rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="290" rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="368" rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="426" rx="118" ry="24" fill="#d5e8d4" stroke="#82b366"/>
    <ellipse cx="420" cy="484" rx="118" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
    <ellipse cx="420" cy="542" rx="118" ry="24" fill="#ffe6cc" stroke="#d79b00"/>
  </g>
  <g text-anchor="middle">
    <text x="420" y="97">Add a student</text>
    <text x="420" y="155">Create project + milestones</text>
    <text x="420" y="213">Choose a meeting slot</text>
    <text x="420" y="295">Enter my free slots</text>
    <text x="420" y="373">Enter class timetable</text>
    <text x="420" y="431">View meetings + milestones</text>
    <text x="420" y="489">Export schedule (.ics)</text>
    <text x="420" y="547">Get a reminder</text>
  </g>

  <!-- Collect arrow -->
  <g>
    <path d="M560,290 h80 v-14 l30,24 l-30,24 v-14 h-80 z" fill="#eee" stroke="#666"/>
    <text x="600" y="345" text-anchor="middle" fill="#555">collect</text>
    <text x="600" y="362" text-anchor="middle" fill="#555">+ sort</text>
  </g>

  <!-- Backlog -->
  <rect x="690" y="76" width="410" height="472" rx="6" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
  <rect x="690" y="76" width="410" height="34" rx="6" fill="#555"/>
  <text x="895" y="99" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">PRODUCT BACKLOG</text>
  <g font-size="12" fill="#555" font-weight="bold">
    <text x="706" y="130">ID</text><text x="762" y="130">Story</text><text x="972" y="130">Priority</text><text x="1050" y="130">Size</text>
  </g>
  <line x1="700" y1="138" x2="1090" y2="138" stroke="#bbb"/>
  <g font-size="12.5">
    <rect x="700" y="146" width="390" height="40" fill="#d5e8d4"/><text x="706" y="171">PB-01</text><text x="762" y="171">Add a student</text><text x="972" y="171">Must</text><text x="1050" y="171">3</text>
    <rect x="700" y="192" width="390" height="40" fill="#d5e8d4"/><text x="706" y="217">PB-02</text><text x="762" y="217">Create project + milestones</text><text x="972" y="217">Must</text><text x="1050" y="217">5</text>
    <rect x="700" y="238" width="390" height="40" fill="#d5e8d4"/><text x="706" y="263">PB-03</text><text x="762" y="263">Enter class timetable</text><text x="972" y="263">Must</text><text x="1050" y="263">5</text>
    <rect x="700" y="284" width="390" height="40" fill="#d5e8d4"/><text x="706" y="309">PB-04</text><text x="762" y="309">Suggest + choose slot</text><text x="972" y="309">Must</text><text x="1050" y="309">8</text>
    <rect x="700" y="330" width="390" height="40" fill="#d5e8d4"/><text x="706" y="355">PB-05</text><text x="762" y="355">View meetings + milestones</text><text x="972" y="355">Must</text><text x="1050" y="355">3</text>
    <rect x="700" y="376" width="390" height="40" fill="#dae8fc"/><text x="706" y="401">PB-06</text><text x="762" y="401">Export schedule (.ics)</text><text x="972" y="401">Should</text><text x="1050" y="401">3</text>
    <rect x="700" y="422" width="390" height="40" fill="#ffe6cc"/><text x="706" y="447">PB-07</text><text x="762" y="447">Get a reminder</text><text x="972" y="447">Could</text><text x="1050" y="447">5</text>
    <rect x="700" y="468" width="390" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="4 3"/><text x="706" y="493" fill="#888">…</text><text x="762" y="493" fill="#888">new ideas, bugs, demo feedback</text>
  </g>
  <text x="1090" y="70" font-size="11" fill="#2e7d32" text-anchor="end">▲ top = do first</text>
  <text x="1108" y="530" font-size="11" fill="#d79b00" text-anchor="end">▼ do later</text>

  <!-- Legend -->
  <g transform="translate(700,580)" font-size="12">
    <ellipse cx="12" cy="0" rx="12" ry="8" fill="#d5e8d4" stroke="#82b366"/><text x="30" y="4">Must</text>
    <ellipse cx="102" cy="0" rx="12" ry="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="120" y="4">Should</text>
    <ellipse cx="200" cy="0" rx="12" ry="8" fill="#ffe6cc" stroke="#d79b00"/><text x="218" y="4">Could</text>
    <text x="0" y="30" fill="#555">Size = story points (1, 2, 3, 5, 8)</text>
  </g>
</svg>
